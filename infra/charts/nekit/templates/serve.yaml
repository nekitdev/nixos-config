apiVersion: apps/v1
kind: Deployment
metadata:
  name: nekit-serve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nekit-serve
  template:
    metadata:
      labels:
        app: nekit-serve
    spec:
      containers:
        - name: nekit-serve
          image: "{{ .Values.serve.image }}:{{ .Values.serve.tag }}"
          ports:
            - containerPort: {{ .Values.serve.port }}
          env:
            - name: NEKIT_SERVE_PORT
              value: "{{ .Values.serve.port }}"
---
apiVersion: v1
kind: Service
metadata:
  name: nekit-serve
spec:
  type: NodePort
  selector:
    app: nekit-serve
  ports:
    - port: {{ .Values.serve.port }}
      targetPort: {{ .Values.serve.port }}
      nodePort: {{ .Values.serve.nodePort }}
